<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lobo Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <!-- Truco sin JavaScript: el checkbox guarda si el menú está abierto o cerrado -->
    <input type="checkbox" id="menu-toggle" class="menu-toggle">

    <div class="header__inner">
      <a href="#" class="logo" aria-label="Lobo Games, ir al inicio">
        <span class="logo__mark">L</span>
        <span class="logo__text">Lobo Games</span>
      </a>

      <!-- El label funciona como botón hamburguesa (solo se ve en tablet y móvil) -->
      <label for="menu-toggle" class="hamburger" aria-label="Abrir o cerrar menú">
        <span></span><span></span><span></span>
      </label>

      <div class="header__menu">
        <nav class="nav" aria-label="Principal">
          <a href="#" class="nav__link nav__link--active">Tienda</a>
          <a href="#" class="nav__link">Biblioteca</a>
          <a href="#" class="nav__link">Comunidad</a>
        </nav>

        <form class="search" role="search" action="#">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" name="q" placeholder="Buscar juegos" aria-label="Buscar juegos">
        </form>

        <div class="actions">
          <a href="#" class="icon-btn" aria-label="Carrito">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.3a1 1 0 0 0 1-.8L21 7H6"/></svg>
          </a>
          <a href="#" class="btn">Iniciar sesión</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido de prueba para ver el header fijo al hacer scroll -->
  <main class="placeholder">
    <h1>Contenido de la página</h1>
  </main>

</body>
</html>
